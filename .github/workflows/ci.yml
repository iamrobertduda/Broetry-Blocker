name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Backend tests
        working-directory: backend
        run: |
          npm ci
          npm test
      - name: Extension end-to-end tests
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm test
